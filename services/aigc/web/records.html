<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用与访问记录 · 学习通工具</title><link rel="stylesheet" href="style.css?v=20261113-layout-csp"><script src="page-layout.js?v=20261113-layout-csp"></script><script src="appearance.js?v=20261113-layout-csp" defer></script><script src="records.js?v=20261113-layout-csp" defer></script></head>
<body>
<header id="aigc-server-header" class="server-panel-header" aria-label="Server Panel 通用顶部栏" hidden><a class="server-panel-brand" href="/server-readme/" target="_top"><span>HOMESERVER ·</span><strong>AIGC 文档检测</strong></a><a class="server-panel-return" href="/server-readme/" target="_top">←返回server panel</a><button id="aigc-appearance-trigger" class="appearance-trigger" type="button" aria-haspopup="dialog" aria-controls="aigc-appearance" aria-expanded="false"><span aria-hidden="true">◐</span>外观与排版</button></header>
<dialog id="aigc-appearance" aria-labelledby="aigc-appearance-title"><div class="aigc-settings-heading"><h2 id="aigc-appearance-title">外观与排版</h2><button id="aigc-appearance-close" type="button" aria-label="关闭外观与排版">×</button></div><p>调整 AIGC 检测与记录页面的显示方式，设置保存在当前浏览器。</p><form id="aigc-appearance-form">
<fieldset><legend>界面明暗</legend><div class="aigc-options"><label><input type="radio" name="theme" value="light">浅色</label><label><input type="radio" name="theme" value="dark">深色</label></div></fieldset>
<fieldset><legend>界面色调</legend><div class="aigc-options"><label><input type="radio" name="tone" value="green">淡绿色</label><label><input type="radio" name="tone" value="blue">淡蓝色</label><label><input type="radio" name="tone" value="red">淡红色</label><label><input type="radio" name="tone" value="pink">淡粉色</label><label><input type="radio" name="tone" value="purple">淡紫色</label></div></fieldset>
<div id="aigc-page-layout"></div><button id="aigc-layout-reset" type="button">恢复默认排版</button><p id="aigc-layout-status" role="status"></p></form></dialog>
<header id="aigc-external-header"><a class="brand" href="./">学习通工具<span>ChaoXingHelper</span></a><a href="./">返回检测 ↗</a></header>
<main><section class="intro"><span class="eyebrow">内部管理</span><h1>使用与访问记录</h1><p>外部按设备证书名称识别，内网记录来源 IP。访问页保留最近 10000 条页面访问、提交、报告下载及错误记录。</p></section>
<nav class="records-pages"><button id="show-jobs">检测记录</button><button id="show-access">访问记录</button></nav>
<p id="records-status" role="status">正在读取记录…</p>
<div class="records-scroll"><table class="records-table"><thead id="records-head"><tr><th>提交时间</th><th>使用者 / IP</th><th>文档</th><th>状态</th><th>结果</th><th>报告</th></tr></thead><tbody id="records-body"></tbody></table></div>
<nav class="records-pages"><button id="previous" disabled>上一页</button><span id="page"></span><button id="next" disabled>下一页</button></nav>
</main><footer>学习通工具 <span>检测记录仅内部可见</span></footer>
</body></html>
