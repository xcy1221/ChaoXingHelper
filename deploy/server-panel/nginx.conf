server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/markdown;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location = / { try_files /panel.html =404; }
    location ~* \.md$ { default_type text/markdown; try_files $uri =404; }
    location / { try_files $uri =404; }
}
