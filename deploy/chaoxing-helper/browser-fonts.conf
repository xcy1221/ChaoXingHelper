<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong"><family>Arial</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
</fontconfig>
